<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유튜브 자막 추출</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --fg: #1d1d1f; --muted: #6e6e73;
    --line: #e2e0db; --accent: #e5322d; --accent-fg: #fff; --err-bg: #fdecea; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --card: #1e1e1f; --fg: #f2f2f2; --muted: #9a9aa0;
      --line: #333336; --accent: #ff4b44; --accent-fg: #fff; --err-bg: #3a1d1b; --err: #ffb4ab;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 28px; }
  form { display: flex; gap: 8px; }
  input[type=url] {
    flex: 1; min-width: 0; padding: 14px 16px; font-size: 16px; color: var(--fg);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; outline: none;
  }
  input[type=url]:focus { border-color: var(--accent); }
  button {
    padding: 0 20px; font-size: 15px; font-weight: 600; cursor: pointer;
    border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .opts { display: flex; gap: 20px; flex-wrap: wrap; margin: 14px 2px 0; color: var(--muted); font-size: 14px; }
  .opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  select { font-size: 14px; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; }
  .error { margin-top: 20px; padding: 12px 16px; border-radius: 12px; background: var(--err-bg); color: var(--err); }
  .result { margin-top: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); }
  .bar .meta { flex: 1; color: var(--muted); font-size: 13px; }
  .bar { flex-wrap: wrap; }
  .bar button, .bar .btn { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  .bar .btn {
    color: var(--accent-fg); background: var(--accent); border: 1px solid var(--accent);
    font-weight: 600; text-decoration: none; line-height: 1.5;
  }
  pre {
    margin: 0; padding: 16px; max-height: 60vh; overflow: auto;
    white-space: pre-wrap; word-break: break-word; font: inherit;
  }
  .spin {
    display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px;
    border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
    animation: r .7s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  .summary { margin-top: 20px; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .summary h2 { font-size: 16px; margin: 0 0 4px; }
  .summary p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .summary textarea {
    width: 100%; min-height: 160px; padding: 12px; font: inherit; font-size: 14px; resize: vertical;
    color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  .summary textarea:focus { border-color: var(--accent); }
  .summary .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 14px; }
  .summary .row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .summary .row button { margin-left: auto; padding: 8px 14px; font-size: 14px; }
  .fname { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .result > .fname { padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--line); }
  .summary .fname { margin-top: 10px; font-size: 14px; }
  .fname input {
    flex: 1; min-width: 0; padding: 6px 10px; font: inherit; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  .fname input:focus { border-color: var(--accent); }
  [hidden] { display: none !important; }
  @media (max-width: 520px) { form { flex-direction: column; } button.primary { padding: 14px; } }
</style>
</head>
<body>
<main>
  <h1><span>▶</span> 유튜브 자막 추출</h1>
  <p class="sub">링크를 붙여넣으면 영상 대사를 텍스트로 뽑아줍니다.</p>

  <form id="f">
    <input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=..." aria-label="유튜브 링크" autofocus>
    <button class="primary" id="go">텍스트 추출</button>
  </form>
  <div class="opts">
    <label><input type="checkbox" id="ts"> 시간 표시</label>
    <label title="유튜브 자동 자막 대신 음성을 직접 받아씁니다. 정확하지만 영상 길이에 비례해 시간이 걸립니다."><input type="checkbox" id="hq"> 고정밀 모드 (느림)</label>
    <label>언어
      <select id="lang">
        <option value="ko,en">한국어 우선</option>
        <option value="en,ko">영어 우선</option>
        <option value="ja,ko,en">일본어 우선</option>
      </select>
    </label>
  </div>

  <div class="error" id="err" role="alert" hidden></div>

  <section class="result" id="res" hidden>
    <div class="bar">
      <span class="meta" id="meta"></span>
      <button id="copy">복사</button>
      <button id="dl">.txt 다운로드</button>
      <button id="dlmd">.md 다운로드</button>
      <button id="sumcopy" title="요점정리 요청문 + 전문을 복사합니다. claude.ai 등 AI 채팅에 붙여넣으세요.">요점정리용 복사</button>
      <a class="btn" href="https://claude.ai/new" target="_blank" rel="noopener">Claude 열기 ↗</a>
    </div>
    <label class="fname">파일 이름 <input id="fname" aria-label="저장할 파일 이름" spellcheck="false"> .txt / .md</label>
    <pre id="out"></pre>
  </section>

  <section class="summary" id="sum" hidden>
    <h2>요점정리 .md로 저장</h2>
    <p>AI 답변의 복사 버튼으로 복사한 요점정리를 붙여넣으면, 영상 정보와 합쳐 마크다운 노트로 저장합니다.</p>
    <textarea id="sumtext" placeholder="여기에 AI가 정리한 요약을 붙여넣으세요 (Cmd+V)" aria-label="요점정리 붙여넣기"></textarea>
    <label class="fname">파일 이름 <input id="sumname" aria-label="요점정리 파일 이름" spellcheck="false"> .md</label>
    <div class="row">
      <label><input type="checkbox" id="sumfull" checked> 전체 대사도 함께 저장</label>
      <button class="primary" id="dlsum" disabled>요약 .md 다운로드</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
// 마지막 추출 결과. .md 파일 조립과 파일명에 사용
let last = null;

function download(content, name, type) {
  const blob = new Blob([content], {type: `${type};charset=utf-8`});
  const a = Object.assign(document.createElement("a"), {href: URL.createObjectURL(blob), download: name});
  a.click();
  URL.revokeObjectURL(a.href);
}

// 파일명에 쓸 수 없는 문자 제거. 제목이 없으면 영상 ID
// 파일명에 쓸 수 없는 문자 제거. 사용자가 확장자까지 적어도 중복되지 않게 떼어냄. 비면 fallback
const safeName = (v, fallback) =>
  v.trim().replace(/\.(md|txt)$/i, "").replace(/[\\/:*?"<>|]/g, "_").trim().slice(0, 120) || fallback;
// 기본 파일명: 영상 제목, 없으면 영상 ID
const fileBase = () => safeName(last.title || "", last.vid);

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const go = $("go");
  go.disabled = true;
  go.innerHTML = `<span class="spin"></span>${$("hq").checked ? "받아쓰는 중 (몇 분 걸림)" : "추출 중"}`;
  $("err").hidden = true;
  try {
    const r = await fetch("/api/extract", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({url: $("url").value, lang: $("lang").value, timestamps: $("ts").checked, whisper: $("hq").checked}),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    $("out").textContent = data.text;
    const words = data.text.length.toLocaleString();
    $("meta").textContent = `${data.source} · ${words}자`;
    last = data;
    // 이전 영상의 요약이 새 영상 정보와 섞여 저장되지 않게 비움
    $("sumtext").value = "";
    $("fname").value = fileBase();
    $("sumname").value = `${fileBase()} - 요점정리`;
    $("dlsum").disabled = true;
    $("res").hidden = false;
    $("sum").hidden = false;
  } catch (err) {
    $("err").textContent = err.message === "Failed to fetch"
      ? "서버에 연결할 수 없습니다. 실행 창이 켜져 있는지 확인하세요."
      : err.message;
    $("err").hidden = false;
  } finally {
    go.disabled = false;
    go.textContent = "텍스트 추출";
  }
});

$("copy").addEventListener("click", async () => {
  await navigator.clipboard.writeText($("out").textContent);
  $("copy").textContent = "복사됨 ✓";
  setTimeout(() => $("copy").textContent = "복사", 1500);
});

const SUMMARY_PROMPT = `다음은 유튜브 영상의 대사를 받아쓴 텍스트야. 요점정리해줘.

마크다운 형식으로 작성하고, 소제목은 ### 로 시작해줘:
### 핵심 요약 (3줄)
### 주제별 요점 (주제마다 #### 소제목 + 글머리표)
### 중요한 용어·숫자·고유명사

받아쓰기라 오타나 잘못 인식된 단어가 있을 수 있으니 문맥으로 판단해줘.

---
`;

$("sumcopy").addEventListener("click", async () => {
  await navigator.clipboard.writeText(SUMMARY_PROMPT + $("out").textContent);
  $("sumcopy").textContent = "복사됨 ✓ 붙여넣으세요";
  setTimeout(() => $("sumcopy").textContent = "요점정리용 복사", 2000);
});

$("dl").addEventListener("click", () => download(last.text + "\n", `${safeName($("fname").value, fileBase())}.txt`, "text/plain"));
$("dlmd").addEventListener("click", () => download(last.md_header + last.md_body + "\n", `${safeName($("fname").value, fileBase())}.md`, "text/markdown"));

$("sumtext").addEventListener("input", () => $("dlsum").disabled = !$("sumtext").value.trim());
$("dlsum").addEventListener("click", () => {
  let md = last.md_header + "## 요점정리\n\n" + $("sumtext").value.trim() + "\n";
  if ($("sumfull").checked) md += "\n---\n\n## 전체 대사\n\n" + last.md_body + "\n";
  download(md, `${safeName($("sumname").value, `${fileBase()} - 요점정리`)}.md`, "text/markdown");
});
</script>
</body>
</html>
